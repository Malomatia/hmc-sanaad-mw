<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;align-items:center;gap:30px;}
  .demo{position:relative;border:1px dashed #BFBFBF;padding:40px;background:#FAFAFA;}
  .logo{height:60px;display:block;}
  .demo .x{position:absolute;background:rgba(207,10,44,.12);border:1px dashed #CF0A2C;}
  .x.t{top:0;left:0;right:0;height:40px;}
  .x.b{bottom:0;left:0;right:0;height:40px;}
  .x.l{left:0;top:40px;bottom:40px;width:40px;}
  .x.r{right:0;top:40px;bottom:40px;width:40px;}
  .label{font-family:var(--font-mono);font-size:9px;color:#CF0A2C;position:absolute;top:4px;left:4px;}
  .info{flex:1;}
  .info h4{margin:0 0 8px;font-size:14px;font-weight:600;}
  .info p{margin:0;font-size:12px;line-height:1.55;color:#4A4A4A;}
  .info code{font-family:var(--font-mono);font-size:11px;background:#F2F2F2;padding:1px 5px;}
</style></head><body>
<div class="demo">
  <div class="x t"><span class="label">x</span></div>
  <div class="x b"><span class="label">x</span></div>
  <div class="x l"><span class="label">x</span></div>
  <div class="x r"><span class="label">x</span></div>
  <img class="logo" src="../assets/logos/malomatia-logo.png">
</div>
<div class="info">
  <h4>Exclusion zone</h4>
  <p>No graphic element should encroach within a margin equal to <code>x</code> — the cap height of the wordmark. Applies on every side, every application.</p>
</div>
</body></html>
