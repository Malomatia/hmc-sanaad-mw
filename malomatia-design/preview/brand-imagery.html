<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
  .img{position:relative;height:200px;background-size:cover;background-position:center;}
  .label{position:absolute;bottom:0;left:0;right:0;padding:14px 16px 12px;color:#fff;background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));}
  .label .t{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
  .label .s{font-size:10px;color:#BFBFBF;margin-top:2px;}
</style></head><body>
<div class="img" style="background-image:url(../assets/imagery/qatar-skyline-arches.jpg)"><div class="label"><div class="t">Qatar landmarks</div><div class="s">cinematic, warm dusk</div></div></div>
<div class="img" style="background-image:url(../assets/imagery/cloud-circuit.jpg)"><div class="label"><div class="t">Cyber / cloud</div><div class="s">cool blue cast</div></div></div>
<div class="img" style="background-image:url(../assets/imagery/portrait-mono.jpg);background-position:top"><div class="label"><div class="t">Leadership portrait</div><div class="s">desaturated, soft grey</div></div></div>
<div class="img" style="background-image:url(../assets/imagery/server-cables.jpg)"><div class="label"><div class="t">Infrastructure</div><div class="s">first-plane subject + motion</div></div></div>
<div class="img" style="background-image:url(../assets/imagery/global-network.jpg)"><div class="label"><div class="t">Concept · network</div><div class="s">high contrast B&amp;W</div></div></div>
<div class="img" style="background-image:url(../assets/imagery/boardroom-data.jpg)"><div class="label"><div class="t">People + data</div><div class="s">augmented HUD overlay</div></div></div>
</body></html>
