<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:14px;align-items:stretch;}
  .sw{flex:1;display:flex;flex-direction:column;border-radius:2px;overflow:hidden;border:1px solid var(--grey-200);}
  .chip{height:72px;}
  .meta{padding:8px 10px;background:#fff;}
  .name{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#000;margin-bottom:2px;}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-2);}
  .pmsline{font-size:10px;color:var(--fg-3);margin-top:1px;}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#CF0A2C"></div><div class="meta"><div class="name">malomatia red</div><div class="hex">#CF0A2C</div><div class="pmsline">Pantone 186 C · RGB 207·10·44</div></div></div>
  <div class="sw"><div class="chip" style="background:#777575"></div><div class="meta"><div class="name">metallic grey</div><div class="hex">#777575</div><div class="pmsline">Pantone 8401 metallic</div></div></div>
  <div class="sw"><div class="chip" style="background:#999999"></div><div class="meta"><div class="name">cool grey</div><div class="hex">#999999</div><div class="pmsline">Pantone 877 C · 40% K</div></div></div>
  <div class="sw"><div class="chip" style="background:#000000"></div><div class="meta"><div class="name">black</div><div class="hex">#000000</div><div class="pmsline">100% K</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--grey-200)"></div><div class="meta"><div class="name">white</div><div class="hex">#FFFFFF</div><div class="pmsline">paper / negative space</div></div></div>
</div>
</body></html>
