<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);max-width:520px;}
  .field{margin-bottom:16px;}
  .label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#000;margin-bottom:6px;}
  .input{width:100%;font-family:var(--font-sans);font-size:14px;padding:10px 12px;border:1px solid #BFBFBF;border-radius:2px;background:#fff;box-sizing:border-box;transition:border-color .15s;}
  .input:focus{outline:none;border-color:#CF0A2C;box-shadow:0 0 0 2px rgba(207,10,44,.15);}
  .input.err{border-color:#CF0A2C;}
  .help{font-size:11px;color:#777575;margin-top:4px;}
  .help.err{color:#CF0A2C;}
  textarea.input{min-height:64px;resize:vertical;font-family:var(--font-sans);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
</style></head><body>
<div class="row2">
  <div class="field"><label class="label">Full name</label><input class="input" value="Khalifa Al Mannai"></div>
  <div class="field"><label class="label">Organization</label><input class="input" placeholder="Government entity, ministry, …"></div>
</div>
<div class="field"><label class="label">Email</label><input class="input err" value="invalid@"><div class="help err">Please enter a valid work email.</div></div>
<div class="field"><label class="label">How can we help</label><textarea class="input" placeholder="Tell us about your digital transformation goals."></textarea></div>
</body></html>
