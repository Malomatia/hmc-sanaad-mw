<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px;background:#fff;font-family:var(--font-sans);display:flex;gap:24px;align-items:flex-end;justify-content:space-between;}
  .item{text-align:center;}
  .box{width:90px;height:64px;background:#CF0A2C;margin:0 auto 8px;}
  .name{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:1px;}
</style></head><body>
<div class="item"><div class="box" style="border-radius:0"></div><div class="name">--radius-0</div><div class="val">0px</div></div>
<div class="item"><div class="box" style="border-radius:2px"></div><div class="name">--radius-sm</div><div class="val">2px · default</div></div>
<div class="item"><div class="box" style="border-radius:4px"></div><div class="name">--radius-md</div><div class="val">4px · max</div></div>
<div class="item"><div class="box" style="border-radius:8px"></div><div class="name">--radius-lg</div><div class="val">8px · avoid</div></div>
<div class="item"><div class="box" style="border-radius:999px;width:120px"></div><div class="name">--radius-pill</div><div class="val">999px · pills only</div></div>
</body></html>
