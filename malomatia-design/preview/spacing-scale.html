<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;align-items:center;gap:14px;padding:8px 0;}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);width:100px;flex-shrink:0;}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);width:48px;flex-shrink:0;text-align:right;}
  .bar{height:14px;background:#CF0A2C;}
</style></head><body>
<div class="row"><div class="name">--space-1</div><div class="px">4px</div><div class="bar" style="width:4px"></div></div>
<div class="row"><div class="name">--space-2</div><div class="px">8px</div><div class="bar" style="width:8px"></div></div>
<div class="row"><div class="name">--space-3</div><div class="px">12px</div><div class="bar" style="width:12px"></div></div>
<div class="row"><div class="name">--space-4</div><div class="px">16px</div><div class="bar" style="width:16px"></div></div>
<div class="row"><div class="name">--space-5</div><div class="px">24px</div><div class="bar" style="width:24px"></div></div>
<div class="row"><div class="name">--space-6</div><div class="px">32px</div><div class="bar" style="width:32px"></div></div>
<div class="row"><div class="name">--space-8</div><div class="px">48px</div><div class="bar" style="width:48px"></div></div>
<div class="row"><div class="name">--space-10</div><div class="px">64px</div><div class="bar" style="width:64px"></div></div>
<div class="row"><div class="name">--space-12</div><div class="px">96px</div><div class="bar" style="width:96px"></div></div>
</body></html>
