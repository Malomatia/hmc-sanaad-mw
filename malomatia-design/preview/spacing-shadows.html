<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:36px 30px;background:#FAFAFA;font-family:var(--font-sans);display:flex;gap:32px;align-items:center;justify-content:space-around;}
  .item{text-align:center;}
  .box{width:120px;height:64px;background:#fff;margin:0 auto 14px;}
  .s1{box-shadow:none;border:1px solid var(--grey-200);}
  .s2{box-shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);}
  .s3{box-shadow:0 4px 16px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.10);}
  .s4{box-shadow:0 20px 60px rgba(0,0,0,.18);}
  .name{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
  .val{font-size:10px;color:var(--fg-3);margin-top:2px;}
</style></head><body>
<div class="item"><div class="box s1"></div><div class="name">--shadow-none</div><div class="val">flat · 1px border</div></div>
<div class="item"><div class="box s2"></div><div class="name">--shadow-card</div><div class="val">default elevation</div></div>
<div class="item"><div class="box s3"></div><div class="name">--shadow-elevated</div><div class="val">modal / popover</div></div>
<div class="item"><div class="box s4"></div><div class="name">--shadow-hero</div><div class="val">hero treatment</div></div>
</body></html>
