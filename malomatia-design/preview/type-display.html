<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;}
  .row{display:flex;align-items:baseline;gap:18px;padding:14px 0;border-bottom:1px solid var(--grey-200);}
  .row:last-child{border-bottom:none;}
  .label{flex:0 0 130px;font-family:var(--font-sans);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);}
  .specimen{flex:1;}
  .meta{flex:0 0 auto;font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head><body>
<div class="row"><div class="label">display 1</div><div class="specimen" style="font-family:var(--font-display);font-weight:300;font-size:64px;line-height:1.05;letter-spacing:-0.02em;text-transform:lowercase;">reimagining</div><div class="meta">Equestrienne · 300 · 64</div></div>
<div class="row"><div class="label">display 2</div><div class="specimen" style="font-family:var(--font-display);font-weight:300;font-size:42px;line-height:1.05;letter-spacing:-0.02em;text-transform:lowercase;">excel with IT</div><div class="meta">Equestrienne · 300 · 42</div></div>
<div class="row"><div class="label">quote</div><div class="specimen" style="font-family:var(--font-display);font-weight:300;font-size:28px;line-height:1.2;color:#000;"><span style="color:#CF0A2C">“</span>boldly reimagine what's possible<span style="color:#CF0A2C">”</span></div><div class="meta">Equestrienne · 300 · 28</div></div>
</body></html>
