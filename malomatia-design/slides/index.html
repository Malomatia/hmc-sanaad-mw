<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>malomatia · Sample Slides</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="deck_stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; background:#1a1a1a; font-family: var(--font-sans); }
  deck-stage > section { box-sizing: border-box; }
</style>
</head>
<body>
<deck-stage width="1920" height="1080" id="deck"></deck-stage>

<script type="text/babel" src="SlideChrome.jsx"></script>
<script type="text/babel" src="Slides.jsx"></script>
<script type="text/babel" data-presets="env,react">
// Mount each slide into its own section element inside <deck-stage>
const stage = document.getElementById('deck');
const slides = [
  <CoverSlide />, <SectionDividerSlide />, <StatsSlide />,
  <QuoteSlide />, <ServicesSlide />, <SuccessStorySlide />
];
slides.forEach((el, i) => {
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:relative;width:100%;height:100%;';
  stage.appendChild(wrapper);
  ReactDOM.createRoot(wrapper).render(el);
});
</script>
</body>
</html>
