<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>malomatia · Corporate Website</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin:0; font-family: var(--font-sans); color: #000; background: #fff; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #BFBFBF; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" data-presets="env,react">
function App() {
  React.useEffect(() => {
    const t = setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
    return () => clearTimeout(t);
  });
  return (
    <>
      <Header />
      <Hero />
      <StatsStrip />
      <Services />
      <Sectors />
      <FeaturedStory />
      <QuoteBanner />
      <Leadership />
      <Footer />
    </>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
// Re-init lucide on any new render
const obs = new MutationObserver(() => { if (window.lucide) lucide.createIcons(); });
obs.observe(document.body, { childList:true, subtree:true });
</script>
</body>
</html>
